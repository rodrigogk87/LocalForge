# Mundo 8: subagentes con contexto aislado.
#
# Las dependencias de abajo NO son decorativas: si este paquete importa algo que
# no declara, `uv run --package localforge-agents` falla con ModuleNotFoundError.
# Es lo que hace imposible el import circular que este proyecto ya tuvo una vez.
[project]
name = "localforge-agents"
version = "0.1.0"
description = "Mundo 8: subagentes con contexto aislado."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "localforge-core",
    "localforge-harness",
    "localforge-providers",
    "localforge-sandbox",
    "localforge-tools",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "localforge.agents"
# namespace: los once paquetes montan sus modulos bajo el mismo `localforge.`
# sin que ninguno sea dueño del paquete raiz (PEP 420).
namespace = true

[tool.uv.sources]
localforge-core = { workspace = true }
localforge-harness = { workspace = true }
localforge-providers = { workspace = true }
localforge-sandbox = { workspace = true }
localforge-tools = { workspace = true }

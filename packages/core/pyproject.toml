# El vocabulario compartido. Lo importan los otros diez.
#
# Las dependencias de abajo NO son decorativas: si este paquete importa algo que
# no declara, `uv run --package localforge-core` falla con ModuleNotFoundError.
# Es lo que hace imposible el import circular que este proyecto ya tuvo una vez.
[project]
name = "localforge-core"
version = "0.1.0"
description = "El vocabulario compartido. Lo importan los otros diez."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "localforge"
# namespace: los once paquetes montan sus modulos bajo el mismo `localforge.`
# sin que ninguno sea dueño del paquete raiz (PEP 420).
namespace = true

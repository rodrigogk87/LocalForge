# La interfaz de linea de comandos.
#
# Las dependencias de abajo NO son decorativas: si este paquete importa algo que
# no declara, `uv run --package localforge-cli` falla con ModuleNotFoundError.
# Es lo que hace imposible el import circular que este proyecto ya tuvo una vez.
[project]
name = "localforge-cli"
version = "0.1.0"
description = "La interfaz de linea de comandos."
requires-python = ">=3.12"
dependencies = [
    "localforge-agents",
    "localforge-context",
    "localforge-core",
    "localforge-durable",
    "localforge-evals",
    "localforge-harness",
    "localforge-providers",
    "localforge-sandbox",
    "localforge-tools",
]

[project.scripts]
localforge = "localforge.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "localforge.cli"
# namespace: los once paquetes montan sus modulos bajo el mismo `localforge.`
# sin que ninguno sea dueño del paquete raiz (PEP 420).
namespace = true

[tool.uv.sources]
localforge-agents = { workspace = true }
localforge-context = { workspace = true }
localforge-core = { workspace = true }
localforge-durable = { workspace = true }
localforge-evals = { workspace = true }
localforge-harness = { workspace = true }
localforge-providers = { workspace = true }
localforge-sandbox = { workspace = true }
localforge-tools = { workspace = true }

# Mundos 1 y 3: el runtime. Es el INTEGRADOR: importa de seis mundos.
#
# Las dependencias de abajo NO son decorativas: si este paquete importa algo que
# no declara, `uv run --package localforge-harness` falla con ModuleNotFoundError.
# Es lo que hace imposible el import circular que este proyecto ya tuvo una vez.
[project]
name = "localforge-harness"
version = "0.1.0"
description = "Mundos 1 y 3: el runtime. Es el INTEGRADOR: importa de seis mundos."
requires-python = ">=3.12"
dependencies = [
    "localforge-context",
    "localforge-core",
    "localforge-durable",
    "localforge-providers",
    "localforge-sandbox",
    "localforge-skills",
    "localforge-tools",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "localforge.harness"
# namespace: los once paquetes montan sus modulos bajo el mismo `localforge.`
# sin que ninguno sea dueño del paquete raiz (PEP 420).
namespace = true

[tool.uv.sources]
localforge-context = { workspace = true }
localforge-core = { workspace = true }
localforge-durable = { workspace = true }
localforge-providers = { workspace = true }
localforge-sandbox = { workspace = true }
localforge-skills = { workspace = true }
localforge-tools = { workspace = true }

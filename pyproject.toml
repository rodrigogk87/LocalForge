# Este repositorio NO es un paquete Python.
#
# El codigo vive en `worlds/`: un proyecto independiente por mundo, cada uno con
# su propio pyproject, su venv, su lockfile y sus tests. Para trabajar, entrás a
# uno:
#
#   cd worlds/8-multiagent-w8 && uv sync --extra dev && uv run pytest -q
#
# Lo que hay acá arriba es la infraestructura del repo: los tests que verifican
# que los ocho mundos sean consistentes entre si, y que las guias no mientan
# sobre el codigo.
#
#   uv sync --extra dev    # solo pytest, para correr esos tests
#   uv run pytest -q
[project]
name = "localforge-repo"
version = "0.1.0"
description = "LocalForge: un coding agent local, contado en ocho mundos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
